name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Ahead of everything else, and ahead of `bun test` especially. A
      # self-referential symlink in the tree makes the test runner die with an
      # empty report — 48 bytes, no test names, exit 1 — so a broken tree shape
      # deletes the evidence instead of failing a check. One did, for a while:
      # `hidden-plugin`, a `git add -A` leftover pointing at an absolute path
      # that was the repo root. This probe needs no dependencies and no host.
      - name: test:tree — no symlink points off this machine
        run: bun run test:tree
      # Frozen by default under CI, so a package.json pin that disagrees with
      # bun.lock fails here instead of surfacing later as a drifted
      # node_modules. The "pin == host omp" invariant has broken three times;
      # this is the gate that stops the fourth.
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      # Includes test/versions.test.ts, which hard-asserts installed == pin.
      # The host-omp comparison inside it warns only (no omp in this job).
      - run: bun test
      # The eighth probe, and the only one that needs no omp at all: it drives the
      # takeover against the host's real ModelRegistry, constructed in-process.
      # What it caught (another extension's provider deleted by an arm/restore
      # cycle) was invisible to every check in this file, so it belongs here
      # rather than in host-probes — it is seconds, not minutes.
      - name: test:registry — takeover against the real model registry
        run: bun run test:registry

  # The real-host probes. These boot an actual omp and drive the bridge over
  # MCP, so they are the only checks that exercise the real execution path.
  # They used to be unrunnable off a developer machine: each one copied
  # ~/.omp/agent/models.yml, i.e. a real provider and a real API key. The
  # request path of the bridge asks the model nothing, so a placeholder
  # provider is enough for six of them to boot — see test/harness.ts.
  # test:takeover is the exception: it arms a reachable counting sink, because
  # counting what the host's own session dials is the thing under test.
  # (The eighth probe, test:registry, drives the same takeover against the real
  # ModelRegistry without booting a host, so it sits in the `check` job.)
  host-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # The host binary, at the version this repo pins in devDependencies. The
      # extension is typechecked against that same version and imports
      # @oh-my-pi/* through the host's runtime shim, so the probes must run
      # against the pinned version rather than whatever is newest. Read from
      # package.json so this cannot drift from the pin silently.
      - name: Read the pinned host version
        id: pin
        run: |
          v=$(node -p "require('./package.json').devDependencies['@oh-my-pi/pi-coding-agent']")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "pinned host omp: $v"
      - name: Install the host omp
        run: bun add --global "@oh-my-pi/pi-coding-agent@${{ steps.pin.outputs.version }}"
      - name: Host version
        run: omp --version
      - run: bun install
      # test/versions.test.ts compares the installed devDeps against this omp's
      # own version and warns on a mismatch; run it here too so a drifted pin
      # surfaces in the job that actually has a host to compare against.
      - run: bun test
      - run: bun run typecheck

      # Each probe is its own step so a failure names the one that broke.
      # test:approval takes ~95s on purpose: it holds a bash call open until the
      # caller's own timeout fires, and that hang is the behaviour under test.
      - name: test:smoke — real-host E2E
        run: bun run test:smoke
      - name: test:hardening — auth, sessions, audit
        run: bun run test:hardening
      # The bootstrap script is the README's install path with the host layer under
      # it. Groups 1-4 drive it against a recording stub `omp`, and the last group
      # runs it against the omp installed above, in a throwaway HOME. The host-install
      # half only ever comes out as a printed plan; the one live item reads the pin
      # from the manifest URL the script derives from the README's install line
      # and prints `info:` when it cannot.
      - name: test:bootstrap — the one-shot host + extension installer
        run: bun run test:bootstrap
      # The bridge fetches a missing dufs or cloudflared by itself, pinned by version
      # and sha256. Those pins are only worth what the build has been measured to do,
      # so this probe downloads for real, HEADs every pinned asset for a target it
      # cannot run, and drives the fetched binaries: GET bytes, Range, PUT landing on
      # disk, a wrong password refused, the port released after stop, a real tunnel.
      - name: test:obtain — pinned downloads and a real share on them
        run: bun run test:obtain
      # The narrative suite: every scenario ends with its consequence checked
      # through a channel other than the one that produced it (filesystem, audit
      # log, port state). Each scenario has been shown to fail against a
      # deliberately broken bridge — see docs/testing.md.
      - name: test:scenario — end-to-end scenarios, verified off-channel
        run: bun run test:scenario
      # This one installs for real: it runs `omp install .` itself, then starts a
      # host and drives the bridge over MCP. As of host 18.11.0 `~/.omp/plugins`
      # follows HOME, so both halves run inside a throwaway HOME and leave nothing
      # registered on the runner.
      # The fifth group is the half that has to leave the network: a host whose PATH
      # answers to neither binary fetches both pinned builds and serves a file from
      # them. ~46 MB of egress per run, and it lands in that host's own throwaway
      # HOME — see test/install-probe.ts. The sixth group drives the reserved
      # npm-name shape — `omp install a2mcp` against the registry in a second
      # throwaway HOME — and asserts what landed is the packed tarball; the
      # package is not published, so that group prints `info:` and skips daily.
      # CI does not go red on the network either way.
      - name: test:install — package self-containment and a real host over MCP
        run: bun run test:install
      - name: test:approval — approval boundary (expects VERDICT B)
        run: bun run test:approval
      # The takeover probe is the only check that lets the host dial a real
      # listener: a counting sink replaces the dead-port provider, so "zero
      # model requests" becomes a countable fact instead of an absence. It
      # carries its own negative control (toggle on -> the sink hears), which
      # is the half that the 2026-10-12 wake-up finding proved necessary.
      - name: test:takeover — host inference deny/restore with counting sink
        run: bun run test:takeover

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run build
      # The mermaid diagrams render client-side, so a green build does not prove
      # they appear. Load the built site in a real browser and assert on the text
      # inside the rendered SVG. Also checks per-page canonical / og:image /
      # twitter:card / JSON-LD.
      #
      # The probe resolves a browser itself: CHROME, else the first of
      # google-chrome / chromium-browser / chromium that exists. GitHub's runner
      # images ship Google Chrome pre-installed (under /opt/hostedtoolcache,
      # which is why the probe scans more than /usr/bin), so nothing is installed
      # here.
      #
      # The first version of this job installed Playwright's chromium and hung
      # for 30+ minutes on `--with-deps` (apt). The second installed it without
      # --with-deps, got the binary, and still saw an empty DOM — because the
      # probe's control request reported a broken harness rather than three
      # phantom diagram failures, but the underlying browser never ran.
      #
      # If a future image ships no browser at all, the probe says so by name
      # ("tried chromium-browser, chromium, google-chrome") instead of silently
      # reporting every diagram as broken.
      - name: Show which browser the probe will use
        run: |
          for b in google-chrome chromium-browser chromium; do
            if command -v "$b" >/dev/null; then echo "using $b: $(command -v "$b")"; exit 0; fi
          done
          echo "none of google-chrome / chromium-browser / chromium is present" >&2
          exit 1
      - run: bun run check
